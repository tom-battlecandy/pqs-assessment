services:
  api:
    build:
      context: .
      target: api
    environment:
      API_PORT: 3000
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/London}
      CLIENT_ORIGIN: http://localhost:5173
      DATABASE_PATH: /app/data/pqs.sqlite
    init: true
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data

  client:
    build:
      context: .
      target: client
    depends_on:
      - api
    environment:
      VITE_API_URL: http://api:3000
    init: true
    ports:
      - '5173:5173'
